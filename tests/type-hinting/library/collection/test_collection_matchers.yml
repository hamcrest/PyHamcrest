- case: collection_matchers_accept_non_sequence_collections
  skip: platform.python_implementation() == "PyPy"
  main: |
    from hamcrest import (
        assert_that,
        contains_inanyorder,
        has_item,
        has_items,
        is_in,
        only_contains,
    )

    items = {1, 2, 3}
    mapping = {"a": 1, "b": 2}

    assert_that(items, has_item(1))
    assert_that(items, has_items(1, 2))
    assert_that(items, contains_inanyorder(1, 2, 3))
    assert_that(items, only_contains(1, 2, 3))
    assert_that(1, is_in(items))
    assert_that(mapping, has_item("a"))
    assert_that(mapping.values(), has_items(1, 2))
    assert_that("a", is_in(mapping))
