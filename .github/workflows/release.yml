name: Release
on:
  push:
    tags:
      - V*
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

  release:
    types:
      - published

permissions:
  contents: read

jobs:
  pure-python-wheel-and-sdist:
    name: Build a pure Python wheel and source distribution
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all tags; this is needed for hatch-vcs
          fetch-depth: 0
          persist-credentials: false

      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  publish-test-release:
    permissions:
      contents: read
      # Needed for trusted publishing.
      id-token: write

    name: Publish in-dev package to test.pypi.org
    environment: publish-test-release
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    needs:
      - pure-python-wheel-and-sdist

    steps:
      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Upload package to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-release:
    permissions:
      contents: read
      # Needed for trusted publishing.
      id-token: write

    name: Publish release
    environment: publish-release
    needs:
      - pure-python-wheel-and-sdist
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.ref, 'refs/tags'))

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: Push build artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
