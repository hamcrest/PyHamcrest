---
name: CI

on:
  push:
    branches: ["main", "master", "ci-testing-*"]

  pull_request:
    branches: ["main", "master"]

  schedule:
    - cron: "0 6 * * MON" # Every Monday morning

  workflow_dispatch:

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    env:
      USING_COVERAGE: "3.10,3.11,3.12,3.13,3.14"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.11"
        exclude:
          - os: macos-latest
            python-version: pypy3.11

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We want our tags here
          fetch-depth: 0
          persist-credentials: false

      - name: Install the latest version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: "Run tox targets for ${{ matrix.python-version }}"
        env:
          TOX_GH_MAJOR_MINOR: ${{ matrix.python-version }}
        run: uvx --with tox-uv --with tox-gh tox

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.os }}
          path: ".coverage*"
          if-no-files-found: ignore
          include-hidden-files: true

  coverage:
    needs:
      - tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          uvx --with coverage[toml] coverage combine

        # ignore-errors is so that we don't gag on missing code in .tox environments
      - name: Generate the HTML report
        run: uvx --with coverage[toml] coverage html --skip-covered --skip-empty --ignore-errors

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: htmlcov

        # ignore-errors is so that we don't gag on missing code in .tox environments
      - name: Enforce the coverage
        run: uvx --with coverage[toml] coverage report --ignore-errors --fail-under 95

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-24.04"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We want our tags here
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

  install-dev:
    strategy:
      matrix:
        os: ["ubuntu-24.04", "windows-latest", "macos-latest"]

    name: "Verify dev env / ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: "Install development environment"
        run: uv sync --locked
      - name: "Import package"
        run: "uv run python -c 'import hamcrest; print(hamcrest.__version__)'"
